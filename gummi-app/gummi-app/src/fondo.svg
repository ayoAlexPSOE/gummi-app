      <stop offset="1" stop-color="#3a62ff" stop-opacity="0"/>
    </radialGradient>
  <radialGradient id="cupula" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#1c3fd0" stop-opacity=".1"/><stop offset=".8" stop-color="#2a5bff" stop-opacity=".3"/><stop offset="1" stop-color="#6fd8ff" stop-opacity=".5"/></radialGradient>
  </defs>
  <rect width="1000" height="760" fill="url(#halo)"/>
