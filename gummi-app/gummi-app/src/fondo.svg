  <polygon points="318.6,-103.5 232.3,-29.6 258.7,81.0 161.7,21.7 64.7,81.0 91.1,-29.6 4.8,-103.5 118.0,-112.6 161.7,-217.5 205.3,-112.6" fill="url(#borde2)" fill-opacity=".10" stroke="url(#borde2)" stroke-width="3.5" stroke-linejoin="round"/>
  <polygon points="196.9,271.0 99.9,211.8 2.9,271.0 29.3,160.5 -57.0,86.5 56.3,77.5 99.9,-27.5 143.6,77.5 256.8,86.5 170.5,160.5" fill="url(#borde)" fill-opacity=".10" stroke="url(#borde)" stroke-width="3.5" stroke-linejoin="round"/>
  <polygon points="-196.9,271.0 -170.5,160.5 -256.8,86.5 -143.6,77.5 -99.9,-27.5 -56.3,77.5 57.0,86.5 -29.3,160.5 -2.9,271.0 -99.9,211.8" fill="url(#borde2)" fill-opacity=".10" stroke="url(#borde2)" stroke-width="3.5" stroke-linejoin="round"/>
  <polygon points="-318.6,-103.5 -205.3,-112.6 -161.7,-217.5 -118.0,-112.6 -4.8,-103.5 -91.1,-29.6 -64.7,81.0 -161.7,21.7 -258.7,81.0 -232.3,-29.6" fill="url(#borde)" fill-opacity=".10" stroke="url(#borde)" stroke-width="3.5" stroke-linejoin="round"/>
