<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" preserveAspectRatio="xMaxYMin slice">
  <defs>
    <linearGradient id="borde" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7ad9"/>
      <stop offset=".35" stop-color="#4f7bff"/>
      <stop offset=".7" stop-color="#3ddcff"/>
      <stop offset="1" stop-color="#c8f6ff"/>
    </linearGradient>
    <linearGradient id="borde2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3ddcff"/>
      <stop offset=".5" stop-color="#5a78ff"/>
